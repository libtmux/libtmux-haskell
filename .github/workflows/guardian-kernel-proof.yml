name: Private native guardian proof

on:
  push:
    branches: [probe/guardian-kernel-20261118]

permissions:
  contents: read

jobs:
  guardian:
    name: Native threaded guardian (tmux ${{ matrix.tmux }})
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        tmux: ['3.3a', '3.8']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build released tmux
        id: tmux
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.tmux }}
          configure-args: --disable-utf8proc
      - name: Prove native guardian ownership and host state
        env:
          LIBTMUX_TEST_TMUX: ${{ steps.tmux.outputs.binary }}
        run: |
          mkdir -p "$RUNNER_TEMP/guardian-proof"
          python3 .startup-spike/probe_native_host.py \
            --tmux "$LIBTMUX_TEST_TMUX" \
            --output "$RUNNER_TEMP/guardian-proof" \
            >"$RUNNER_TEMP/guardian-proof/driver.log" 2>&1
      - name: Show the probe result
        if: always()
        run: cat "$RUNNER_TEMP/guardian-proof/driver.log"
      - name: Retain only this model's receipts and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guardian-native-${{ matrix.tmux }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/guardian-proof/*.json
            ${{ runner.temp }}/guardian-proof/*.log
          if-no-files-found: error
          retention-days: 7
