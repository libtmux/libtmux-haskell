name: Private Haskell guardian proof

on:
  push:
    branches: [probe/guardian-haskell-20261119]

permissions:
  contents: read

jobs:
  guardian:
    name: Haskell guardian (tmux ${{ matrix.tmux }}, N${{ matrix.capabilities }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tmux: ['3.3a', '3.8']
        capabilities: ['1', '2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: haskell
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.18.2.0'
          enable-stack: false
      - name: Build released tmux
        id: tmux
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.tmux }}
          configure-args: --disable-utf8proc
      - name: Restore Haskell dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            ~/.cabal/packages
          key: haskell-ubuntu26-x64-9.14.1-3.18.2.0-${{ hashFiles('*.cabal', 'examples/**/*.cabal', 'cabal.project') }}
          restore-keys: haskell-ubuntu26-x64-9.14.1-3.18.2.0-
      - name: Update package index
        run: cabal update
      - name: Build existing integration dependencies
        run: cabal build integration --only-dependencies
      - name: Prove compiled Haskell membership and status ownership
        env:
          LIBTMUX_TEST_TMUX: ${{ steps.tmux.outputs.binary }}
          PROOF_CAPABILITIES: ${{ matrix.capabilities }}
        run: |
          mkdir -p "$RUNNER_TEMP/guardian-haskell-proof"
          python3 .startup-spike/run_membership.py \
            --output "$RUNNER_TEMP/guardian-haskell-proof" \
            --capabilities "$PROOF_CAPABILITIES" \
            >"$RUNNER_TEMP/guardian-haskell-proof/driver.log" 2>&1
      - name: Show the proof result
        if: always()
        run: cat "$RUNNER_TEMP/guardian-haskell-proof/driver.log"
      - name: Retain only this proof's receipts and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guardian-haskell-${{ matrix.tmux }}-N${{ matrix.capabilities }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/guardian-haskell-proof/*.json
            ${{ runner.temp }}/guardian-haskell-proof/*.log
          if-no-files-found: error
          retention-days: 7
