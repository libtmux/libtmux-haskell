name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      release-artifact:
        description: Checked source and Haddock archives
        value: ${{ jobs.checks.outputs.release-artifact }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      release-artifact: hackage-${{ github.sha }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
          enable-cache: false
      - name: Install script tools from the lock file
        run: uv sync --locked
      - name: Script format check (ruff format)
        run: uv run --locked ruff format --check scripts examples/capture-graph
      - name: Script lint (ruff check)
        run: uv run --locked ruff check scripts examples/capture-graph
      - name: Script type check (ty check)
        run: uv run --locked ty check scripts examples/capture-graph
      - name: Haddock popover script syntax check (node --check)
        run: node --check scripts/prepare_haddock/assets/source-popover.js
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: haskell
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.18.2.0'
          enable-stack: false
      - name: Build example tmux
        id: tmux
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: '3.8'
          configure-args: --disable-utf8proc
          add-to-path: 'true'
      - name: Restore Haskell dependencies
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            ~/.cabal/packages
          key: haskell-ubuntu26-x64-9.14.1-3.18.2.0-${{ hashFiles('*.cabal', 'examples/**/*.cabal', 'cabal.project') }}
          restore-keys: haskell-ubuntu26-x64-9.14.1-3.18.2.0-
      - name: Update the Cabal package index
        run: cabal update
      - name: Build dependencies
        run: cabal build all --only-dependencies
      - name: Build documentation dependencies
        run: cabal build all --enable-documentation --only-dependencies
      - name: Script tests and doctests
        run: uv run --locked pytest
      - name: Record the GHC version
        run: ghc --numeric-version
      - name: Record the Cabal version
        run: cabal --numeric-version
      - name: Build all targets with tests and record the dependency plan
        run: cabal build all --enable-tests --offline
      - name: Specs and properties
        run: cabal test specs --offline --test-show-details=direct --test-options='--strict --fail-on=empty'
      - name: Unit tests
        run: cabal test unit --offline --test-show-details=direct
      - name: Capture-graph runner and README tests
        env:
          LIBTMUX_TEST_TMUX: ${{ steps.tmux.outputs.binary }}
        run: uv run --locked pytest -q examples/capture-graph/test_run.py examples/capture-graph/test_readme.py
      - name: Documented example command
        env:
          LIBTMUX_TEST_TMUX: ${{ steps.tmux.outputs.binary }}
        run: uv run scripts/check_docs/check_docs.py --run
      - name: Public type contracts
        run: uv run scripts/check_types/check_types.py
      - name: Package metadata check
        run: cabal check
      - name: Build API documentation
        run: cabal haddock lib:libtmux-haskell --offline
      - name: Prepare and link-check the native documentation
        run: >-
          uv run scripts/prepare_haddock/prepare_haddock.py
          dist-newstyle/haddock-prepared
          --build-plan dist-newstyle/cache/plan.json
      - name: Preserve checked native documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-docs-${{ github.sha }}-${{ github.run_attempt }}
          path: dist-newstyle/haddock-prepared
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Isolated source-archive consumer
        env:
          LIBTMUX_TEST_TMUX: ${{ steps.tmux.outputs.binary }}
        run: uv run scripts/check_sdist/check_sdist.py
      - name: Prepare checked Hackage archives
        run: uv run scripts/release/release.py prepare
      - name: Retain source and Haddock release archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hackage-${{ github.sha }}-${{ github.run_attempt }}
          path: dist-newstyle/release/
          if-no-files-found: error
          retention-days: 90
      - name: Save Haskell dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            ~/.cabal/packages
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Preserve dependency plan and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            dist-newstyle/cache/plan.json
            dist-newstyle/**/test/*.log
            dist-newstyle/**/doc/html/libtmux-haskell/**
          if-no-files-found: ignore
          retention-days: 7

  tmux:
    name: tmux integration (${{ matrix.tmux }})
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tmux: ['3.3a', '3.8']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: haskell
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.18.2.0'
          enable-stack: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            ~/.cabal/packages
          key: haskell-ubuntu26-x64-9.14.1-3.18.2.0-${{ hashFiles('*.cabal', 'examples/**/*.cabal', 'cabal.project') }}
          restore-keys: haskell-ubuntu26-x64-9.14.1-3.18.2.0-
      - name: Build tmux ${{ matrix.tmux }}
        id: tmux
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.tmux }}
          configure-args: --disable-utf8proc
          add-to-path: 'true'
      - name: Update the Cabal package index
        run: cabal update
      - name: Build integration dependencies
        run: cabal build test:integration --only-dependencies
      - name: Integration tests on one capability
        env:
          LIBTMUX_TEST_TMUX: ${{ steps.tmux.outputs.binary }}
          LC_ALL: C.UTF-8
        run: cabal test integration --offline --test-show-details=direct --test-options='+RTS -N1 -RTS'
      - name: Integration tests on two capabilities
        env:
          LIBTMUX_TEST_TMUX: ${{ steps.tmux.outputs.binary }}
          LC_ALL: C.UTF-8
        run: cabal test integration --offline --test-show-details=direct --test-options='+RTS -N2 -RTS'
      - name: Scalar and observation bytes under the C locale
        env:
          LIBTMUX_TEST_TMUX: ${{ steps.tmux.outputs.binary }}
          LC_ALL: C
        run: cabal test integration --offline --test-show-details=direct --test-options='--pattern=/scalar/||/lossless/||/graph/||/record/||/metadata/||/snapshot/||/control/ +RTS -N1 -RTS'

  required:
    if: always()
    needs: [checks, tmux]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every planned job
        env:
          CHECKS: ${{ needs.checks.result }}
          TMUX: ${{ needs.tmux.result }}
        run: test "$CHECKS $TMUX" = "success success"
