name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      tmux: ${{ steps.matrix.outputs.tmux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: haskell
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.18.2.0'
          enable-stack: false
      - name: Restore Haskell dependencies
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            ~/.cabal/packages
          key: haskell-ubuntu26-x64-9.14.1-3.18.2.0-${{ hashFiles('*.cabal', 'examples/**/*.cabal', 'cabal.project') }}
          restore-keys: haskell-ubuntu26-x64-9.14.1-3.18.2.0-
      - name: Provision dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install --yes --no-install-recommends tmux
          cabal update
          cabal build all --only-dependencies
          cabal build all --enable-documentation --only-dependencies
      - name: Record toolchain and dependency plan
        run: |
          ghc --numeric-version
          cabal --numeric-version
          cabal build all --enable-tests --offline
      - name: Specs, properties and unit tests
        run: |
          cabal test specs --offline --test-show-details=direct --test-options='--strict --fail-on=empty'
          cabal test unit --offline --test-show-details=direct
      - name: Documented example command
        run: |
          python3 scripts/test_check_docs.py
          python3 scripts/check_docs.py --run
      - name: Public type contracts
        run: scripts/check-types
      - name: Build-cache regressions
        env:
          CI_TEST_TMUX: /usr/bin/tmux
        run: python3 -B scripts/test_ci_tmux.py
      - name: Metadata and API documentation
        run: |
          cabal check
          cabal haddock lib:libtmux-haskell --offline
      - name: Isolated source-archive consumer
        run: python3 scripts/check_sdist.py
      - name: Required exact tmux releases
        id: matrix
        run: python3 scripts/ci_tmux.py matrix
      - name: Save Haskell dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            ~/.cabal/packages
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Preserve dependency plan and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist-newstyle/cache/plan.json
            dist-newstyle/**/test/*.log
            dist-newstyle/**/doc/html/libtmux-haskell/**
          if-no-files-found: ignore
          retention-days: 7

  tmux:
    name: tmux integration (${{ matrix.tmux }})
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tmux: ${{ fromJSON(needs.checks.outputs.tmux) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: haskell
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.18.2.0'
          enable-stack: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            ~/.cabal/packages
          key: haskell-ubuntu26-x64-9.14.1-3.18.2.0-${{ hashFiles('*.cabal', 'examples/**/*.cabal', 'cabal.project') }}
      - name: Provision tmux build and runtime libraries
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install --yes --no-install-recommends build-essential libevent-dev libncurses-dev pkg-config bison
      - name: Identify source and build environment
        id: tmux
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
        run: python3 scripts/ci_tmux.py plan "$TMUX_VERSION"
      - name: Restore tmux build
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tmux.outputs.prefix }}
          key: ${{ steps.tmux.outputs.key }}
      - name: Validate executable or rebuild verified source
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: python3 scripts/ci_tmux.py prepare "$TMUX_VERSION"
      - name: Owned fixture, scalar, pin and process integration tests
        env:
          LIBTMUX_TEST_TMUX: ${{ steps.tmux.outputs.binary }}
          LC_ALL: C.UTF-8
        run: |
          cabal test integration --offline --test-show-details=direct --test-options='+RTS -N1 -RTS'
          cabal test integration --offline --test-show-details=direct --test-options='+RTS -N2 -RTS'
      - name: Scalar and observation bytes under the C locale
        env:
          LIBTMUX_TEST_TMUX: ${{ steps.tmux.outputs.binary }}
          LC_ALL: C
        run: |
          cabal test integration --offline --test-show-details=direct --test-options='--pattern=/scalar/||/lossless/||/graph/||/record/ +RTS -N1 -RTS'
      - name: Save tested tmux build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tmux.outputs.prefix }}
          key: ${{ steps.tmux.outputs.key }}

  required:
    if: always()
    needs: [checks, tmux]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every planned job
        env:
          CHECKS: ${{ needs.checks.result }}
          TMUX: ${{ needs.tmux.result }}
        run: test "$CHECKS" = success && test "$TMUX" = success
